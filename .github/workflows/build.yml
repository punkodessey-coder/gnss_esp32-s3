name: Build firmware # includes GNSS configuration-manager feature branch

on:
  push:
    branches: [main, feature/display-ble-imu, 'feature/**', 'ai/ml']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Validate embedded web interface JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("src/main.cpp").read_text(encoding="utf-8")
          marker = "<script>" + chr(10)
          start = source.index(marker) + len(marker)
          end = source.index("</script>", start)
          Path("/tmp/gnss-ui.js").write_text(source[start:end], encoding="utf-8")
          PY
          node --check /tmp/gnss-ui.js

      - name: Set firmware version
        run: echo "FIRMWARE_VERSION=1.2.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build firmware
        run: pio run

      - name: Prepare firmware artifact
        run: |
          VERSION="1.2.${GITHUB_RUN_NUMBER}"
          mkdir -p artifact
          cp .pio/build/esp32s3/firmware.bin artifact/firmware.bin
          printf 'version=%s\\nbuild_date=%s\\ngit_commit=%s\\n' "$VERSION" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_SHA" > artifact/firmware-info.txt
          if [ -f .pio/build/esp32s3/bootloader.bin ]; then cp .pio/build/esp32s3/bootloader.bin artifact/; fi
          if [ -f .pio/build/esp32s3/partitions.bin ]; then cp .pio/build/esp32s3/partitions.bin artifact/; fi

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-GNSS-v1.2.${{ github.run_number }}
          path: artifact/
          if-no-files-found: error
