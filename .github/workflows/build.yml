name: Build firmware # includes GNSS configuration-manager feature branch

on:
  push:
    branches: [main, feature/display-ble-imu, 'feature/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Validate embedded web interface JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path("src/main.cpp").read_text(encoding="utf-8")
          start = source.index("\\n<script>\\n") + len("\\n<script>\\n")
          end = source.index("\\n</script>", start)
          Path("/tmp/gnss-ui.js").write_text(source[start:end], encoding="utf-8")
          PY
          node --check /tmp/gnss-ui.js

      - name: Build firmware
        run: pio run

      - name: Prepare firmware artifact
        run: |
          mkdir -p artifact
          cp .pio/build/esp32s3/firmware.bin artifact/firmware.bin
          if [ -f .pio/build/esp32s3/bootloader.bin ]; then cp .pio/build/esp32s3/bootloader.bin artifact/; fi
          if [ -f .pio/build/esp32s3/partitions.bin ]; then cp .pio/build/esp32s3/partitions.bin artifact/; fi

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-s3-firmware
          path: artifact/
          if-no-files-found: error
