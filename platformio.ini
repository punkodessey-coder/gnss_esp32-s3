[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
  mikalhart/TinyGPSPlus@^1.0.3
  moononournation/GFX Library for Arduino@^1.4.0
  lewisxhe/SensorLib@^0.5.0
  bblanchon/ArduinoJson@^7.0.4
build_flags =
  -DCORE_DEBUG_LEVEL=3
src_filter = +<main.cpp> -<display_test.cpp>

[env:display_test]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_deps =
  moononournation/GFX Library for Arduino@^1.4.0
build_flags =
  -DCORE_DEBUG_LEVEL=3
src_filter = +<display_test.cpp>
